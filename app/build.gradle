android {

    namespace 'top.niunaijun.blackboxa'
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion = "29.0.13846066"
    defaultConfig {
        applicationId "com.twinspace.cloner"
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // TwinSpace: ABI splits are OFF on purpose — one single APK for
        // every phone (Md asked for this, 2026-11-25). The splits used to
        // build 3 APKs (armeabi-v7a, arm64-v8a, universal); a single APK
        // is ~23MB instead of ~12MB per split, but there is only one
        // file to install and it works on all phones.
        splits {
            abi {
                enable false
                reset()

                include 'armeabi-v7a', "arm64-v8a"
                universalApk true
            }
        }
    }

    // TwinSpace release signing (2026-11-27): one consistent release key
    // for every build, so Play Protect can build a reputation for this
    // developer instead of seeing a new unknown debug key on every build.
    // The keystore + passwords live in GitHub repository secrets
    // (RELEASE_KEYSTORE_BASE64 / RELEASE_KEYSTORE_PASSWORD /
    // RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD); the workflow decodes the
    // keystore and passes the values as environment variables. When the
    // variables are absent (a local build without secrets) it falls back
    // to the debug keystore, so a local assembleRelease still works.
    signingConfigs {
        release {
            def ksPath = System.getenv("RELEASE_KEYSTORE_PATH")
            def ksPassword = System.getenv("RELEASE_KEYSTORE_PASSWORD")
            def kAlias = System.getenv("RELEASE_KEY_ALIAS")
            def kPassword = System.getenv("RELEASE_KEY_PASSWORD")
            if (ksPath != null && ksPassword != null && kAlias != null && kPassword != null) {
                storeFile file(ksPath)
                storePassword ksPassword
                keyAlias kAlias
                keyPassword kPassword
            } else {
                storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            // TwinSpace: minify OFF for release. The BlackBox engine relies
            // heavily on reflection (hidden APIs, hooked services), and R8 /
            // ProGuard can strip or rename the targets it reflects on, which
            // breaks clones at runtime. A larger APK is safer than a broken
            // one; the debug build already ships unminified.
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildFeatures {
        viewBinding true
    }
    kotlinOptions {
        jvmTarget = '21'
    }
    packaging {
        jniLibs {
            excludes.add("**/libandroidx.graphics.path.so")
        }
        resources {
            excludes.add("**/libandroidx.graphics.path.so")
        }
    }
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            output.outputFileName = "TwinSpace_${variant.versionName}_${output.baseName}.apk"
        }
    }
}

