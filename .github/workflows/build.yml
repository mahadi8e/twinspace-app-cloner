name: Build TwinSpace (release)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # setup-android defaults to packages 'tools platform-tools', but
          # the obsolete 'tools' package no longer exists in modern
          # cmdline-tools, so sdkmanager exits 1 and the step fails.
          # Only platform-tools is needed here; the platform, build-tools
          # and NDK are installed by the next step.
          packages: platform-tools

      - name: Install SDK platform, build-tools and NDK
        run: |
          sdkmanager --licenses || true
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13846066"

      # TwinSpace release signing (2026-11-27): decode the release keystore
      # from the repository secret into a file on the ephemeral runner.
      # The keystore itself never enters the repo; the decoded file is
      # destroyed with the runner when the job ends.
      - name: Decode release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TwinSpace-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # TwinSpace, 2026-11-28: debug builds are manual-only. This job runs
  # ONLY on workflow_dispatch (never on push to main), so it never
  # produces a debug APK unless someone asks for one from the Actions
  # tab. It is the way to get a debug build for the debug-only
  # "Export log" action in Settings (BuildConfig.DEBUG is true only in
  # debug builds). No keystore step: debug builds use the debug key.
  build-debug:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Same note as the release job: setup-android defaults to
          # packages 'tools platform-tools', but the obsolete 'tools'
          # package no longer exists, so only platform-tools is
          # requested here.
          packages: platform-tools

      - name: Install SDK platform, build-tools and NDK
        run: |
          sdkmanager --licenses || true
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13846066"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TwinSpace-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
